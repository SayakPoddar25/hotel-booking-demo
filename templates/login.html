{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--primary), #1e2a4a);
        padding-top: 80px;
    }
    .login-card {
        background: white;
        padding: 50px;
        border-radius: 30px;
        box-shadow: var(--shadow-lg);
        width: 100%;
        max-width: 450px;
        margin: 20px;
    }
    .login-card h2 {
        text-align: center;
        margin-bottom: 30px;
        color: var(--primary);
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group input {
        width: 100%;
        padding: 14px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        font-size: 1rem;
        transition: var(--transition);
    }
    .form-group input:focus {
        border-color: var(--accent);
        outline: none;
    }
    .btn-login {
        width: 100%;
        background: var(--accent);
        color: var(--primary);
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
    }
    .btn-login:hover {
        background: var(--accent-light);
        transform: translateY(-2px);
    }
    .messages {
        margin-bottom: 20px;
    }
    .alert {
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 10px;
    }
    .alert-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
</style>

<div class="login-container">
    <div class="login-card">
        <h2>Admin Login</h2>
        
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
        <p style="text-align: center; margin-top: 20px; color: var(--gray-mid);">Authorized access only</p>
    </div>
</div>
{% endblock %}
