{% load static %}

<style>
    .hero-section {
        position: relative;
        height: 100vh;
        min-height: 700px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
        margin-top: 0;
    }
    .hero-bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
    }
    .hero-bg-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}
    .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.219), rgba(15, 23, 42, 0.171));
        z-index: 1;
    }
    .hero-content {
        position: relative;
        z-index: 2;
        color: var(--white);
        max-width: 900px;
        padding: 0 20px;
        animation: fadeInUp 1s ease;
    }
    .hero-content h1 {
        font-size: 4.5rem;
        margin-bottom: 20px;
        font-family: 'Playfair Display', serif;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .hero-content .tagline {
        font-size: 1.3rem;
        margin-bottom: 40px;
        opacity: 0.95;
        letter-spacing: 1px;
    }
    .hero-buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
    }
    .btn-hero-primary {
        background: var(--accent);
        color: var(--primary);
        padding: 14px 35px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 700;
        transition: var(--transition);
        display: inline-block;
    }
    .btn-hero-primary:hover {
        background: var(--accent-light);
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(212,175,55,0.3);
    }
    .btn-hero-secondary {
        background: transparent;
        color: var(--white);
        padding: 14px 35px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 700;
        border: 2px solid var(--white);
        transition: var(--transition);
        display: inline-block;
    }
    .btn-hero-secondary:hover {
        background: var(--white);
        color: var(--primary);
        transform: translateY(-3px);
    }
    .scroll-down {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        cursor: pointer;
        animation: bounce 2s infinite;
    }
    .scroll-down .mouse {
        width: 30px;
        height: 50px;
        border: 2px solid var(--white);
        border-radius: 20px;
        position: relative;
    }
    .scroll-down .mouse::before {
        content: '';
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 10px;
        background: var(--white);
        border-radius: 2px;
        animation: scroll 2s infinite;
    }
    .booking-glass {
        position: absolute;
        bottom: -320px;
        left: 10%;
        right:10%;
        transform: translateX(-50%);
        background: rgba(255,255,255,0.98);
        backdrop-filter: blur(20px);
        border-radius: 28px;
        padding: 60px 40px;
        box-shadow: var(--shadow-lg);
        width: 90%;
        max-width: 1200px;
        z-index: 10;
        animation: fadeInUp 1s ease 0.3s both;
    }
    .booking-form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        align-items: end;
    }
    .form-field {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .form-field label {
        font-weight: 600;
        color: var(--primary);
        font-size: 0.85rem;
        letter-spacing: 1px;
    }
    .form-field input, .form-field select {
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 14px;
        font-size: 1rem;
        transition: var(--transition);
        background: white;
    }
    .form-field input:focus, .form-field select:focus {
        border-color: var(--accent);
        outline: none;
    }
    .btn-search-hero {
        background: var(--accent);
        color: var(--primary);
        padding: 12px 30px;
        border: none;
        border-radius: 14px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: var(--transition);
        height: 48px;
    }
    .btn-search-hero:hover {
        background: var(--accent-light);
        transform: translateY(-2px);
    }
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(10px); }
    }
    @keyframes scroll {
        0% { opacity: 1; top: 10px; }
        100% { opacity: 0; top: 30px; }
    }
    @media (max-width: 768px) {
        .hero-content h1 { font-size: 2.5rem; }
        .hero-content .tagline { font-size: 1rem; }
        .booking-glass {
        position: relative !important;
        width: 94% !important; /* স্ক্রিনের ৯৪% জায়গা নেবে, দু'দিকে সমান ৩% করে ফাঁকা থাকবে */
        margin: -50px auto 30px auto !important; /* এই 'auto' টাই বক্সটাকে একদম নিখুঁতভাবে মাঝখানে ধরে রাখবে */
        left: 0 !important;
        right: 0 !important;
        transform: none !important;
        bottom: -220px !important;
        padding: 20px 15px !important; /* জায়গা বাঁচানোর জন্য প্যাডিং ঠিক করা হলো */
        box-sizing: border-box !important; /* এটা দেওয়ার ফলেই বক্সটা আর ডানদিকে চেপে যাবে না */
    }
        .hero-section { height: auto; min-height: 600px; padding-bottom: 40px; }
        .booking-form { grid-template-columns: 1fr; gap: 15px; }
        .hero-buttons { flex-direction: column; align-items: center; }
        .btn-hero-primary, .btn-hero-secondary { width: 200px; text-align: center; }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
        .hero-content h1 { font-size: 3.5rem; }
        .booking-glass { bottom: -60px; }
        .hero-section { height: 90vh; }
    }
</style>

<div class="hero-section">
    
    <!-- Dark Overlay -->
    <div class="hero-overlay"></div>
    
    <!-- Hero Content -->
    <img class="hero-bg-image" src="{% static 'images/Cover.jpg' %}" alt="Hotel Background">
    
    <!-- Dark Overlay -->
    <div class="hero-overlay"></div>
    
    <!-- Hero Content -->
    <div class="hero-content">
        <h1>Experience Luxury<br>Like Never Before</h1>
        <p class="tagline">Where timeless elegance meets modern comfort</p>
        <div class="hero-buttons">
            <a href="/rooms/" class="btn-hero-primary">Explore Rooms</a>
            <a href="/contact/" class="btn-hero-secondary">Contact Us</a>
        </div>
    </div>
    <!-- Scroll Down Indicator -->
    <div class="scroll-down" onclick="document.getElementById('bookingForm').scrollIntoView({behavior: 'smooth'})">
        <div class="mouse"></div>
    </div>
</div>

<!-- Glassmorphism Booking Form -->
<div class="booking-glass" id="bookingForm">
    <form class="booking-form" action="/rooms/" method="GET">
        <div class="form-field">
            <label><i class="fas fa-calendar-alt"></i> CHECK-IN</label>
            <input type="date" name="check_in" id="heroCheckIn" min="{{ today|date:'Y-m-d' }}" required>
        </div>
        <div class="form-field">
            <label><i class="fas fa-calendar-check"></i> CHECK-OUT</label>
            <input type="date" name="check_out" id="heroCheckOut" min="{{ today|date:'Y-m-d' }}" required>
        </div>
        <div class="form-field">
            <label><i class="fas fa-users"></i> GUESTS</label>
            <select name="guests" required>
                <option value="1">1 Guest</option>
                <option value="2" selected>2 Guests</option>
                <option value="3">3 Guests</option>
                <option value="4">4 Guests</option>
                <option value="5">5 Guests</option>
                <option value="6">6 Guests</option>
            </select>
        </div>
        <button type="submit" class="btn-search-hero">
            <i class="fas fa-search"></i> Search Availability
        </button>
    </form>
</div>

<script>
    // Set minimum dates for check-in and check-out
    const today = new Date().toISOString().split('T')[0];
    const checkInInput = document.getElementById('heroCheckIn');
    const checkOutInput = document.getElementById('heroCheckOut');
    
    if (checkInInput) {
        checkInInput.min = today;
        checkInInput.addEventListener('change', function() {
            checkOutInput.min = this.value;
            if (checkOutInput.value && checkOutInput.value < this.value) {
                checkOutInput.value = this.value;
            }
        });
    }
    
    if (checkOutInput) {
        checkOutInput.min = today;
    }
</script>
